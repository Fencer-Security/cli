---
# This workflow runs in the PUBLIC Fencer-Security/cli repository, into which the
# monorepo mirrors the cli/ subtree. It is authored at cli/.github/workflows/ in
# the monorepo so the subtree split lands it at the public repo's
# .github/workflows/. Do not expect it to run inside the monorepo.
name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            snapshot:
                description: "Build a snapshot without publishing a GitHub Release"
                type: boolean
                default: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    COSIGN_VERSION: "2.4.3"
    PROD_BASE_URL: https://app.fencer.dev

jobs:
    release:
        name: Publish CLI release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Derive version from tag
              id: version
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::Tag '$tag' is not a valid vX.Y.Z semver tag"
                      exit 1
                  fi
                  version="${tag#v}"
                  if [[ "$version" == "0.0.0" ]]; then
                      echo "::error::Refusing to ship placeholder version 0.0.0"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "FENCER_CLI_VERSION=$version" >> "$GITHUB_ENV"

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: v${{ env.COSIGN_VERSION }}

            - name: Install Syft
              uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

            - name: Generate third-party notices
              run: make notices

            - name: Release
              uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
              with:
                  distribution: goreleaser
                  version: v2.18.0
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  FENCER_CLI_VERSION: ${{ steps.version.outputs.version }}

            - name: Smoke released linux amd64 binary
              run: |
                  set -euo pipefail
                  bin="$(find dist -type f -path '*linux_amd64*' -name fencer | head -n 1)"
                  test -n "$bin"
                  "$bin" version
                  out="$("$bin" version --output json)"
                  echo "$out"
                  echo "$out" | grep -q "\"version\": \"${{ steps.version.outputs.version }}\""
                  echo "$out" | grep -q "\"default_base_url\": \"${PROD_BASE_URL}\""

            - name: Upload dist artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: fencer-cli-${{ steps.version.outputs.version }}
                  path: |
                      dist/*
                      !dist/config.yaml
                      !dist/artifacts.json
                      !dist/metadata.json
                  if-no-files-found: error
